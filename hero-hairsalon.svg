<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Rich multi-layer gradient simulating a photograph -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1a3d" stop-opacity="1"/>
      <stop offset="30%" stop-color="#7a3d7a" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1a0a1a" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0a1a" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spot1" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#da70d6" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#da70d6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#ffb3ff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffb3ff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a0a1a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot3" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#7a3d7a" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0a1a" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Noise texture for photographic feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base photographic background layers -->
  <rect width="1200" height="500" fill="url(#sky)"/>
  
  <!-- Large soft light pools simulating room/scene lighting -->
  <ellipse cx="400" cy="200" rx="350" ry="280" fill="url(#spot1)" filter="url(#softblur)"/>
  <ellipse cx="850" cy="300" rx="300" ry="240" fill="url(#spot2)" filter="url(#softblur)"/>
  <ellipse cx="200" cy="380" rx="250" ry="180" fill="url(#spot3)" filter="url(#softblur)"/>
  
  <!-- Surface/floor reflection at bottom -->
  <rect x="0" y="380" width="1200" height="120" fill="#1a0a1a" opacity="0.6"/>
  <rect x="0" y="375" width="1200" height="4" fill="#da70d6" opacity="0.2"/>
  
  <!-- Ceiling suggestion at top -->
  <rect x="0" y="0" width="1200" height="60" fill="#1a0a1a" opacity="0.5"/>
  <!-- Hollywood mirror lights -->
  <circle cx="350" cy="90" r="16" fill="#ffb3ff" opacity="0.65"/>
  <circle cx="420" cy="75" r="14" fill="#ffb3ff" opacity="0.6"/>
  <circle cx="490" cy="68" r="15" fill="#ffb3ff" opacity="0.65"/>
  <circle cx="560" cy="65" r="16" fill="#ffb3ff" opacity="0.7"/>
  <circle cx="630" cy="65" r="16" fill="#ffb3ff" opacity="0.7"/>
  <circle cx="700" cy="68" r="15" fill="#ffb3ff" opacity="0.65"/>
  <circle cx="770" cy="75" r="14" fill="#ffb3ff" opacity="0.6"/>
  <circle cx="840" cy="90" r="16" fill="#ffb3ff" opacity="0.65"/>
  <!-- Glow from mirror lights -->
  <rect x="300" y="60" width="600" height="120" fill="#ffb3ff" opacity="0.08" filter="url(#softblur)"/>
  <!-- Styling chair -->
  <rect x="500" y="260" width="200" height="140" rx="15" fill="#3d1a3d" opacity="0.45"/>
  <rect x="480" y="235" width="240" height="45" rx="10" fill="#7a3d7a" opacity="0.38"/>
  <!-- Bokeh from overhead lights -->
  <circle cx="150" cy="180" r="22" fill="#da70d6" opacity="0.18" filter="url(#softblur)"/>
  <circle cx="1050" cy="200" r="20" fill="#ffb3ff" opacity="0.16" filter="url(#softblur)"/>
</svg>