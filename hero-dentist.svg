<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Rich multi-layer gradient simulating a photograph -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e4080" stop-opacity="1"/>
      <stop offset="30%" stop-color="#4a90d9" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0a1628" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spot1" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#87CEEB" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#87CEEB" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffffff" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot3" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#4a90d9" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Noise texture for photographic feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base photographic background layers -->
  <rect width="1200" height="500" fill="url(#sky)"/>
  
  <!-- Large soft light pools simulating room/scene lighting -->
  <ellipse cx="400" cy="200" rx="350" ry="280" fill="url(#spot1)" filter="url(#softblur)"/>
  <ellipse cx="850" cy="300" rx="300" ry="240" fill="url(#spot2)" filter="url(#softblur)"/>
  <ellipse cx="200" cy="380" rx="250" ry="180" fill="url(#spot3)" filter="url(#softblur)"/>
  
  <!-- Surface/floor reflection at bottom -->
  <rect x="0" y="380" width="1200" height="120" fill="#0a1628" opacity="0.6"/>
  <rect x="0" y="375" width="1200" height="4" fill="#87CEEB" opacity="0.2"/>
  
  <!-- Ceiling suggestion at top -->
  <rect x="0" y="0" width="1200" height="60" fill="#0a1628" opacity="0.5"/>
  <!-- Clinical light panels -->
  <rect x="300" y="0" width="600" height="8" fill="#ffffff" opacity="0.6"/>
  <rect x="300" y="0" width="600" height="80" fill="#ffffff" opacity="0.08" filter="url(#softblur)"/>
  <!-- Dental chair suggestion -->
  <rect x="480" y="260" width="240" height="100" rx="20" fill="#1e4080" opacity="0.4"/>
  <rect x="460" y="230" width="280" height="50" rx="15" fill="#4a90d9" opacity="0.35"/>
  <!-- Overhead light halo -->
  <circle cx="600" cy="120" r="90" fill="#ffffff" opacity="0.15" filter="url(#softblur)"/>
  <circle cx="600" cy="120" r="50" fill="#ffffff" opacity="0.2" filter="url(#softblur)"/>
  <!-- Clean sparkle dots -->
  <circle cx="200" cy="150" r="5" fill="#ffffff" opacity="0.6"/>
  <circle cx="900" cy="180" r="4" fill="#ffffff" opacity="0.5"/>
  <circle cx="400" cy="100" r="3" fill="#ffffff" opacity="0.5"/>
  <circle cx="800" cy="120" r="4" fill="#ffffff" opacity="0.45"/>
</svg>