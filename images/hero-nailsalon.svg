<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Rich multi-layer gradient simulating a photograph -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3d1a6b" stop-opacity="1"/>
      <stop offset="30%" stop-color="#7b3fa0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#1a0a2e" stop-opacity="1"/>
      <stop offset="100%" stop-color="#1a0a2e" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spot1" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ff69b4" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#ff69b4" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1a0a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#ffb6c1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#ffb6c1" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#1a0a2e" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot3" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#7b3fa0" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#1a0a2e" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Noise texture for photographic feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base photographic background layers -->
  <rect width="1200" height="500" fill="url(#sky)"/>
  
  <!-- Large soft light pools simulating room/scene lighting -->
  <ellipse cx="400" cy="200" rx="350" ry="280" fill="url(#spot1)" filter="url(#softblur)"/>
  <ellipse cx="850" cy="300" rx="300" ry="240" fill="url(#spot2)" filter="url(#softblur)"/>
  <ellipse cx="200" cy="380" rx="250" ry="180" fill="url(#spot3)" filter="url(#softblur)"/>
  
  <!-- Surface/floor reflection at bottom -->
  <rect x="0" y="380" width="1200" height="120" fill="#1a0a2e" opacity="0.6"/>
  <rect x="0" y="375" width="1200" height="4" fill="#ff69b4" opacity="0.2"/>
  
  <!-- Ceiling suggestion at top -->
  <rect x="0" y="0" width="1200" height="60" fill="#1a0a2e" opacity="0.5"/>
  <!-- Soft vanity lighting -->
  <circle cx="600" cy="80" r="120" fill="#ffb6c1" opacity="0.18" filter="url(#softblur)"/>
  <circle cx="200" cy="150" r="80" fill="#ff69b4" opacity="0.15" filter="url(#softblur)"/>
  <circle cx="1000" cy="160" r="80" fill="#ff69b4" opacity="0.15" filter="url(#softblur)"/>
  <!-- Nail station table -->
  <rect x="350" y="310" width="500" height="80" rx="10" fill="#3d1a6b" opacity="0.45"/>
  <rect x="300" y="290" width="600" height="30" rx="5" fill="#7b3fa0" opacity="0.35"/>
  <!-- Sparkle lights around mirror -->
  <circle cx="350" cy="100" r="6" fill="#ffb6c1" opacity="0.7"/>
  <circle cx="450" cy="80" r="5" fill="#ffb6c1" opacity="0.65"/>
  <circle cx="550" cy="70" r="7" fill="#ffb6c1" opacity="0.7"/>
  <circle cx="650" cy="70" r="6" fill="#ffb6c1" opacity="0.65"/>
  <circle cx="750" cy="80" r="5" fill="#ffb6c1" opacity="0.6"/>
  <circle cx="850" cy="100" r="6" fill="#ffb6c1" opacity="0.65"/>
  <!-- Bokeh orbs -->
  <circle cx="150" cy="300" r="20" fill="#ff69b4" opacity="0.2" filter="url(#softblur)"/>
  <circle cx="1050" cy="320" r="18" fill="#ffb6c1" opacity="0.18" filter="url(#softblur)"/>
</svg>