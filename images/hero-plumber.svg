<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Rich multi-layer gradient simulating a photograph -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a3050" stop-opacity="1"/>
      <stop offset="30%" stop-color="#2d5080" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#0a1520" stop-opacity="1"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spot1" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#4fb3e8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#4fb3e8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#87cefa" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#87cefa" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot3" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#2d5080" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#0a1520" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Noise texture for photographic feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base photographic background layers -->
  <rect width="1200" height="500" fill="url(#sky)"/>
  
  <!-- Large soft light pools simulating room/scene lighting -->
  <ellipse cx="400" cy="200" rx="350" ry="280" fill="url(#spot1)" filter="url(#softblur)"/>
  <ellipse cx="850" cy="300" rx="300" ry="240" fill="url(#spot2)" filter="url(#softblur)"/>
  <ellipse cx="200" cy="380" rx="250" ry="180" fill="url(#spot3)" filter="url(#softblur)"/>
  
  <!-- Surface/floor reflection at bottom -->
  <rect x="0" y="380" width="1200" height="120" fill="#0a1520" opacity="0.6"/>
  <rect x="0" y="375" width="1200" height="4" fill="#4fb3e8" opacity="0.2"/>
  
  <!-- Ceiling suggestion at top -->
  <rect x="0" y="0" width="1200" height="60" fill="#0a1520" opacity="0.5"/>
  <!-- Modern bathroom tiles suggestion -->
  <rect x="0" y="200" width="1200" height="300" fill="#1a3050" opacity="0.2"/>
  <!-- Tile grid -->
  <line x1="0" y1="250" x2="1200" y2="250" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="0" y1="300" x2="1200" y2="300" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="0" y1="350" x2="1200" y2="350" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="200" y1="200" x2="200" y2="500" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="400" y1="200" x2="400" y2="500" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="600" y1="200" x2="600" y2="500" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="800" y1="200" x2="800" y2="500" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <line x1="1000" y1="200" x2="1000" y2="500" stroke="#87cefa" stroke-width="1" opacity="0.1"/>
  <!-- Modern faucet -->
  <rect x="540" y="260" width="120" height="20" rx="10" fill="#4fb3e8" opacity="0.45"/>
  <rect x="592" y="200" width="16" height="80" rx="8" fill="#4fb3e8" opacity="0.4"/>
  <!-- Water shimmer -->
  <ellipse cx="600" cy="340" rx="30" ry="8" fill="#87cefa" opacity="0.3" filter="url(#softblur)"/>
  <!-- Clean overhead light -->
  <rect x="400" y="0" width="400" height="10" fill="#87cefa" opacity="0.5"/>
  <rect x="400" y="0" width="400" height="80" fill="#87cefa" opacity="0.1" filter="url(#softblur)"/>
</svg>