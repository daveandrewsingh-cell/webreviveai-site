<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="1200" height="500" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <!-- Rich multi-layer gradient simulating a photograph -->
    <linearGradient id="sky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8B4513" stop-opacity="1"/>
      <stop offset="30%" stop-color="#D2691E" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#2c1810" stop-opacity="1"/>
      <stop offset="100%" stop-color="#2c1810" stop-opacity="1"/>
    </linearGradient>
    <radialGradient id="spot1" cx="35%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#FFD700" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#FFD700" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2c1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot2" cx="70%" cy="55%" r="35%">
      <stop offset="0%" stop-color="#FF8C00" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#FF8C00" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#2c1810" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="spot3" cx="20%" cy="70%" r="30%">
      <stop offset="0%" stop-color="#D2691E" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2c1810" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="softblur">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <!-- Noise texture for photographic feel -->
    <filter id="noise">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="multiply" result="noisy"/>
      <feComposite in="noisy" in2="SourceGraphic" operator="in"/>
    </filter>
  </defs>
  
  <!-- Base photographic background layers -->
  <rect width="1200" height="500" fill="url(#sky)"/>
  
  <!-- Large soft light pools simulating room/scene lighting -->
  <ellipse cx="400" cy="200" rx="350" ry="280" fill="url(#spot1)" filter="url(#softblur)"/>
  <ellipse cx="850" cy="300" rx="300" ry="240" fill="url(#spot2)" filter="url(#softblur)"/>
  <ellipse cx="200" cy="380" rx="250" ry="180" fill="url(#spot3)" filter="url(#softblur)"/>
  
  <!-- Surface/floor reflection at bottom -->
  <rect x="0" y="380" width="1200" height="120" fill="#2c1810" opacity="0.6"/>
  <rect x="0" y="375" width="1200" height="4" fill="#FFD700" opacity="0.2"/>
  
  <!-- Ceiling suggestion at top -->
  <rect x="0" y="0" width="1200" height="60" fill="#2c1810" opacity="0.5"/>
  <!-- Table with candles - restaurant scene -->
  <ellipse cx="350" cy="340" rx="120" ry="30" fill="#FFD700" opacity="0.12"/>
  <ellipse cx="750" cy="350" rx="100" ry="25" fill="#FFD700" opacity="0.1"/>
  <!-- Candle flames -->
  <ellipse cx="340" cy="220" rx="8" ry="24" fill="#FFD700" opacity="0.7" filter="url(#glow)"/>
  <ellipse cx="340" cy="215" rx="4" ry="14" fill="#fff8dc" opacity="0.9"/>
  <ellipse cx="760" cy="230" rx="7" ry="20" fill="#FFD700" opacity="0.65" filter="url(#glow)"/>
  <ellipse cx="760" cy="226" rx="3.5" ry="12" fill="#fff8dc" opacity="0.85"/>
  <!-- Warm light circles from candles -->
  <circle cx="340" cy="240" r="80" fill="#FFD700" opacity="0.08" filter="url(#softblur)"/>
  <circle cx="760" cy="250" r="65" fill="#FFD700" opacity="0.07" filter="url(#softblur)"/>
  <!-- Wine glasses silhouette -->
  <path d="M580 180 Q610 240 600 280 L640 280 Q630 240 660 180 Z" fill="#FF8C00" opacity="0.18"/>
  <rect x="616" y="280" width="8" height="40" fill="#FF8C00" opacity="0.18"/>
  <rect x="606" y="318" width="28" height="4" fill="#FF8C00" opacity="0.18"/>
  <!-- Bokeh dots - out of focus lights -->
  <circle cx="100" cy="150" r="18" fill="#FFD700" opacity="0.2" filter="url(#softblur)"/>
  <circle cx="200" cy="100" r="12" fill="#FF8C00" opacity="0.18" filter="url(#softblur)"/>
  <circle cx="1000" cy="120" r="20" fill="#FFD700" opacity="0.22" filter="url(#softblur)"/>
  <circle cx="1100" cy="200" r="14" fill="#FF8C00" opacity="0.17" filter="url(#softblur)"/>
  <circle cx="900" cy="80" r="10" fill="#FFD700" opacity="0.2" filter="url(#softblur)"/>
  <circle cx="450" cy="70" r="16" fill="#FF8C00" opacity="0.15" filter="url(#softblur)"/>
</svg>